services:
  frontend:
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8082}:80"

  agentic-backend:
    volumes:
      - ./agentic_backend/src:/app/src
    ports:
      - "${BACKEND_PORT:-3001}:8000"
    environment:
      LOG_LEVEL: DEBUG
      PYTHONPATH: /app/src
    command:
      - ".venv/bin/uvicorn"
      - "api.app:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
      - "--reload-dir"
      - "/app/src"

  web-backend:
    ports:
      - "${ACCOUNTS_PORT:-8083}:8000"
    # Dev only: with DJANGO_DEBUG=false the settings set
    # SESSION_COOKIE_SECURE/CSRF_COOKIE_SECURE, so over plain HTTP the session
    # cookie is dropped and every successful admin login bounces back to
    # /admin/login/ — the loop the stack was showing.
    environment:
      DJANGO_DEBUG: "true"
      # .env carries the production host/origin lists; plain-HTTP localhost
      # is not in them, so Django 400s every dev request with DisallowedHost.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web-backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8082,http://127.0.0.1:8082,http://localhost:8083,http://127.0.0.1:8083
    volumes:
      - ./web_backend/politicalagent:/app/politicalagent
      - ./web_backend/users:/app/users
      - ./web_backend/accounts_api:/app/accounts_api
      - ./web_backend/pages:/app/pages
      - ./web_backend/blog:/app/blog
      - ./web_backend/chat:/app/chat
      - ./web_backend/checkpointer:/app/checkpointer
      - ./web_backend/emails:/app/emails
      # The blog's content lives outside its package: templates resolve from
      # BASE_DIR/templates and the stylesheet from STATICFILES_DIRS, so without
      # these two mounts an edit to the HTML or CSS only lands after a rebuild.
      - ./web_backend/templates:/app/templates
      - ./web_backend/static:/app/static
    command: [".venv/bin/python", "manage.py", "runserver", "0.0.0.0:8000"]

  postgres:
    ports:
      - "${POSTGRES_PORT:-55432}:5432"

  phoenix:
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
