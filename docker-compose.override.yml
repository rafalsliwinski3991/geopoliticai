services:
  backend:
    volumes:
      - ./app/src:/app/src
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: DEBUG
      PYTHONPATH: /app/src
    command:
      - ".venv/bin/uvicorn"
      - "api:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
      - "--reload-dir"
      - "/app/src"

  frontend:
    ports:
      - "3000:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
