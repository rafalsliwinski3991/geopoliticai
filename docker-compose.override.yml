services:
  frontend:
    profiles:
      - production

  backend:
    volumes:
      - ./app/src:/app/src
      - ./frontend/index.html:/app/frontend/index.html:ro
    ports:
      - "3000:8000"
    environment:
      LOG_LEVEL: DEBUG
      PYTHONPATH: /app/src
    command:
      - ".venv/bin/uvicorn"
      - "api:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
      - "--reload-dir"
      - "/app/src"
