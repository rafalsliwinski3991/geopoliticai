services:
  frontend:
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8082}:80"

  backend:
    volumes:
      - ./app/src:/app/src
      - ./frontend/index.html:/app/frontend/index.html:ro
      - ./frontend/assets:/app/frontend/assets:ro
    ports:
      - "${BACKEND_PORT:-3001}:8000"
    environment:
      LOG_LEVEL: DEBUG
      PYTHONPATH: /app/src
    command:
      - ".venv/bin/uvicorn"
      - "api:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--reload"
      - "--reload-dir"
      - "/app/src"

  postgres:
    ports:
      - "${POSTGRES_PORT:-55432}:5432"

  phoenix:
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
