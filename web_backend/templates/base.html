{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PoliticalAgent{% endblock %}</title>
<link rel="icon" href="{% static 'site/logo-mark-small.svg' %}">
<link rel="stylesheet" href="{% static 'site/style.css' %}">
{% block head %}{% endblock %}
</head>
<body class="graticule">
<header class="shell">
  <div class="masthead">
    <a class="wordmark" href="/">Political<em>Agent</em></a>
    <nav>
      <a href="/blog/">Notes</a>
      <a href="/chat">Ask</a>
      {% if user.is_authenticated %}
        <a href="{% url 'account_logout' %}">Sign out</a>
      {% else %}
        <a href="{% url 'account_login' %}">Sign in</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="shell">{% block content %}{% endblock %}</main>
<footer class="shell">
  <div class="foot">
    <span>PoliticalAgent — geopolitical research with named sources</span>
    <nav style="display:flex;gap:20px">
      <a href="/blog/">Notes</a>
      <a href="/chat">Ask</a>
    </nav>
  </div>
</footer>
</body>
</html>
