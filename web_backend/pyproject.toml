[project]
name = "web-backend"
version = "0.1.0"
description = "Django identity service: accounts, admin, threads and quota schema, public pages."
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-allauth[socialaccount]>=65.19,<66",
    "whitenoise>=6.9,<7",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "gunicorn>=23.0,<24",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
