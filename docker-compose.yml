# One project name for every checkout and every VPS release directory, so
# `docker compose` in /srv/geopoliticai/releases/<sha>/ drives the same
# containers and volumes (the default would be the directory name).
name: geopoliticai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geopoliticai
      POSTGRES_USER: geopoliticai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopoliticai -d geopoliticai"]
      interval: 5s
      timeout: 5s
      retries: 12

  agentic-backend:
    build: ./agentic_backend
    # CI pushes :<sha> and :latest; the VPS pulls with IMAGE_TAG=<sha> and
    # never builds (its release directories hold no build context).
    image: ghcr.io/rafalsliwinski3991/geopoliticai-agentic-backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://geopoliticai:${POSTGRES_PASSWORD}@postgres:5432/geopoliticai
      ARIZE_PLATFORM: ${ARIZE_PLATFORM:-PHOENIX}
      ARIZE_COLLECTOR_ENDPOINT: ${ARIZE_COLLECTOR_ENDPOINT:-}
      ARIZE_SPACE_ID: ${ARIZE_SPACE_ID:-}
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      ARIZE_PROJECT_NAME: ${ARIZE_PROJECT_NAME:-geopoliticai-expert}
      ARIZE_API_KEY: ${ARIZE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started

  web-backend:
    build: ./web_backend
    image: ghcr.io/rafalsliwinski3991/geopoliticai-web-backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      POSTGRES_DB: geopoliticai
      POSTGRES_USER: geopoliticai
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ghcr.io/rafalsliwinski3991/geopoliticai-frontend:${IMAGE_TAG:-latest}
    depends_on:
      agentic-backend:
        condition: service_started

  phoenix:
    image: arizephoenix/phoenix:version-20.4.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

volumes:
  postgres_data:
  phoenix_data:
