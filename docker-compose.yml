# One project name for every checkout and every VPS release directory, so
# `docker compose` in /srv/geopoliticai/releases/<sha>/ drives the same
# containers and volumes (the default would be the directory name).
name: geopoliticai

services:
  postgres:
    build: ./postgres
    image: ghcr.io/rafalsliwinski3991/geopoliticai-postgres:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_DB: geopoliticai
      POSTGRES_USER: geopoliticai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopoliticai -d geopoliticai"]
      interval: 5s
      timeout: 5s
      retries: 12

  agentic-backend:
    build: ./agentic_backend
    # CI pushes :<sha> and :latest; the VPS pulls with IMAGE_TAG=<sha> and
    # never builds (its release directories hold no build context).
    image: ghcr.io/rafalsliwinski3991/geopoliticai-agentic-backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://geopoliticai:${POSTGRES_PASSWORD}@postgres:5432/geopoliticai
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      SANDBOX_MCP_URL: http://mcp-server:8000/mcp
    networks: [default, sandbox]
    depends_on:
      postgres:
        condition: service_healthy
      phoenix:
        condition: service_started

  # Runs model-written Python (README, "Code sandbox"). No env_file: it holds no
  # secret. Only on `sandbox`, so its code cannot reach Phoenix, Postgres,
  # web-backend, the host, or the internet. agentic-backend does not wait for it:
  # a broken sandbox fails deep turns that compute, never the site; `up --wait`
  # still fails a deploy when it is unhealthy.
  mcp-server:
    build: ./mcp_server
    image: ghcr.io/rafalsliwinski3991/geopoliticai-mcp-server:${IMAGE_TAG:-latest}
    networks: [sandbox]
    init: true
    read_only: true
    # Root-owned and not world-writable, so a run cannot leave a file there.
    tmpfs:
      - /dev/shm:size=1m,mode=0755
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    # No System V IPC or message queues: such objects outlive their process and
    # would carry state from one run to the next.
    sysctls:
      fs.mqueue.queues_max: "0"
      kernel.shmmni: "0"
      kernel.msgmni: "0"
      kernel.sem: "0 0 0 0"
    mem_limit: 384m
    cpus: 1
    pids_limit: 256
    healthcheck:
      test:
        - "CMD"
        - ".venv/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 6

  web-backend:
    build: ./web_backend
    image: ghcr.io/rafalsliwinski3991/geopoliticai-web-backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      POSTGRES_DB: geopoliticai
      POSTGRES_USER: geopoliticai
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ghcr.io/rafalsliwinski3991/geopoliticai-frontend:${IMAGE_TAG:-latest}
    depends_on:
      agentic-backend:
        condition: service_started

  phoenix:
    image: arizephoenix/phoenix:version-20.4.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

networks:
  # No route out (`internal`) and no host address on the bridge (`isolated`,
  # Docker Engine 28.0+): with `internal` alone, sandbox code still reaches host
  # services listening on 0.0.0.0.
  sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  postgres_data:
  phoenix_data:
