services:
  postgres:
    restart: unless-stopped

  phoenix:
    restart: unless-stopped
    # Served at https://politicalagent.eu/phoenix/ behind nginx Basic Auth;
    # nginx strips the prefix, as Phoenix's reverse-proxy example does.
    environment:
      PHOENIX_HOST_ROOT_PATH: /phoenix
      PHOENIX_ROOT_URL: https://politicalagent.eu/phoenix

  agentic-backend:
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - ".venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web-backend:
    restart: unless-stopped

  frontend:
    profiles: []
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot on the host writes renewal challenges here (README runbook).
      - /var/www/certbot:/var/www/certbot:ro
    environment:
      AUTH_REQUIRED: "true"
      AUTH_USER: ${AUTH_USER:?AUTH_USER must be set in production}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD must be set in production}
    depends_on:
      agentic-backend:
        condition: service_healthy
    restart: unless-stopped
