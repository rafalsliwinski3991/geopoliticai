[project]
name = "mcp-server"
version = "0.0.1"
description = "GeopoliticAI code sandbox: an MCP server that runs model-written Python."
# The image is python:3.12-slim.
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "mcp>=2.3,<3",
    "pydantic>=2.0,<3.0",
    # Not `uvicorn[standard]`: it brings uvloop, which rejects the `user=`,
    # `group=` and `extra_groups=` a run is started with.
    "uvicorn>=0.41,<1",
    # For the model's code, not the server's.
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "httpx>=0.27,<1.0",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# A bare `pytest` runs only the unit tests; the container tests need the image.
testpaths = ["tests/unit_tests"]
