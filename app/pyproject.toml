[project]
name = "geopoliticai"
version = "0.2.0"
description = "Multi-perspective political analysis pipeline built on LangGraph and FastAPI."
authors = [
    { name = "GeopoliticAI maintainers" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["langgraph", "fastapi", "political-analysis", "fact-checking"]
dependencies = [
    "fastapi>=0.110,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langgraph>=1.0.0",
    "openai>=1.40,<2.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]
postgres = ["langgraph-checkpoint-postgres>=3.0,<4.0", "psycopg[binary]>=3.1,<4.0"]
evals = ["langsmith>=0.1.100"]

[project.scripts]
geopoliticai = "geopoliticai.cli:main"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["geopoliticai*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
