# The proxy_set_header block and HTTP version shared by every upstream location
# in nginx.conf and nginx.local.conf (extracted once three locations repeated it).
proxy_http_version 1.1;
# $http_host preserves the port the browser used, so allauth's absolute
# verification and password-reset links keep working on a non-80 port.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# nginx sets HSTS itself on every response; drop the upstream copy so there is one.
proxy_hide_header Strict-Transport-Security;
