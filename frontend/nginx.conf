# Rate limit /api/* by client IP, matching the in-process token bucket
# in app/src/geopoliticai/api.py (defense in depth — nginx survives
# horizontal scaling, the in-process limiter does not).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
limit_req_status 429;

server {
  listen 80;
  server_name politicalagent.eu www.politicalagent.eu;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name politicalagent.eu www.politicalagent.eu;

  ssl_certificate /etc/letsencrypt/live/politicalagent.eu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/politicalagent.eu/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    include /etc/nginx/auth_snippet.conf;
    try_files $uri /index.html;
  }

  location /api/ {
    # Health check must remain unauthenticated and unthrottled for the
    # backend container's healthcheck to succeed.
    location = /api/health {
      resolver 127.0.0.11 valid=10s;
      set $backend_url http://backend:8000;
      proxy_pass $backend_url;
      proxy_http_version 1.1;
    }

    limit_req zone=api_limit burst=5 nodelay;

    resolver 127.0.0.11 valid=10s;
    set $backend_url http://backend:8000;
    proxy_pass $backend_url;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
