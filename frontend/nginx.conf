server {
  listen 80;
  server_name politicalagent.eu www.politicalagent.eu;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name politicalagent.eu www.politicalagent.eu;

  ssl_certificate /etc/letsencrypt/live/politicalagent.eu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/politicalagent.eu/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    include /etc/nginx/auth_snippet.conf;
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
