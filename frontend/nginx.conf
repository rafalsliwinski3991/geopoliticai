server {
  listen 80;
  server_name politicalagent.eu www.politicalagent.eu;

  # certbot renews with --webroot into this directory (README runbook); the
  # first certificate is issued with --standalone because nginx cannot start
  # without it.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # One hop to the canonical host, whichever name was asked for.
  location / {
    return 301 https://politicalagent.eu$request_uri;
  }
}

# www is an alias only: search engines must see one host (the certificate
# already covers both names).
server {
  listen 443 ssl;
  server_name www.politicalagent.eu;

  ssl_certificate /etc/letsencrypt/live/politicalagent.eu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/politicalagent.eu/privkey.pem;

  return 301 https://politicalagent.eu$request_uri;
}

server {
  listen 443 ssl;
  server_name politicalagent.eu;

  ssl_certificate /etc/letsencrypt/live/politicalagent.eu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/politicalagent.eu/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  # Django owns `/` from unit 11 (the landing page); the SPA stays at /chat.
  location / {
    resolver 127.0.0.11 valid=10s;
    set $web_backend http://web-backend:8000;
    proxy_pass $web_backend;
    include /etc/nginx/proxy_common.conf;
  }

  location /chat {
    # The SPA shell has no content of its own; keep it out of search results
    # without blocking the crawl (a robots.txt disallow would hide this header).
    add_header X-Robots-Tag "noindex" always;
    try_files $uri /chat/index.html;
  }

  location /accounts/ {
    resolver 127.0.0.11 valid=10s;
    set $web_backend http://web-backend:8000;
    proxy_pass $web_backend;
    include /etc/nginx/proxy_common.conf;
  }

  location /admin/ {
    include /etc/nginx/auth_snippet.conf;
    resolver 127.0.0.11 valid=10s;
    set $web_backend http://web-backend:8000;
    proxy_pass $web_backend;
    include /etc/nginx/proxy_common.conf;
  }

  # Phoenix traces hold full, unredacted conversations: same Basic Auth as
  # /admin/. Phoenix expects the prefix stripped (PHOENIX_HOST_ROOT_PATH
  # tells it which prefix to put back into its own links).
  location /phoenix/ {
    include /etc/nginx/auth_snippet.conf;
    resolver 127.0.0.11 valid=10s;
    set $phoenix http://phoenix:6006;
    rewrite ^/phoenix/(.*)$ /$1 break;
    proxy_pass $phoenix;
    include /etc/nginx/proxy_common.conf;
    # The Phoenix UI may hold live connections; let them upgrade.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
  }

  location /static/ {
    resolver 127.0.0.11 valid=10s;
    set $web_backend http://web-backend:8000;
    proxy_pass $web_backend;
    include /etc/nginx/proxy_common.conf;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend_url http://agentic-backend:8000;
    proxy_pass $backend_url;
    include /etc/nginx/proxy_common.conf;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
