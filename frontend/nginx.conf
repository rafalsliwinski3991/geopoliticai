server {
  listen 80;
  server_name politicalagent.eu www.politicalagent.eu;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name politicalagent.eu www.politicalagent.eu;

  ssl_certificate /etc/letsencrypt/live/politicalagent.eu/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/politicalagent.eu/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  location /accounts/ {
    proxy_pass http://web-backend:8000;
    include /etc/nginx/proxy_common.conf;
  }

  location /admin/ {
    include /etc/nginx/auth_snippet.conf;
    proxy_pass http://web-backend:8000;
    include /etc/nginx/proxy_common.conf;
  }

  location /static/ {
    proxy_pass http://web-backend:8000;
    include /etc/nginx/proxy_common.conf;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend_url http://agentic-backend:8000;
    proxy_pass $backend_url;
    include /etc/nginx/proxy_common.conf;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
