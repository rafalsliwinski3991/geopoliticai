server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # The Alpine shell is gone; the SPA owns the conversation until Django
  # takes `/` in unit 11.
  location / {
    return 302 /chat;
  }

  location /chat {
    try_files $uri /chat/index.html;
  }

  location /accounts/ {
    include /etc/nginx/auth_snippet.conf;
    proxy_pass http://web-backend:8000;
    include /etc/nginx/proxy_common.conf;
  }

  location /admin/ {
    include /etc/nginx/auth_snippet.conf;
    proxy_pass http://web-backend:8000;
    include /etc/nginx/proxy_common.conf;
  }

  location /static/ {
    include /etc/nginx/auth_snippet.conf;
    proxy_pass http://web-backend:8000;
    include /etc/nginx/proxy_common.conf;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend_url http://agentic-backend:8000;
    proxy_pass $backend_url;
    include /etc/nginx/proxy_common.conf;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
