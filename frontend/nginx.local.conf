server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Keep Location relative ("/chat"): implicit absolute redirects use $host,
  # which strips the port, so http://127.0.0.1:8082/ would bounce to port 80.
  absolute_redirect off;

  # Resolve upstreams at request time; a literal proxy_pass host is resolved at
  # config load, so nginx exits if web-backend is not up yet.
  resolver 127.0.0.11 valid=10s;

  # Django owns `/` from unit 11 (the landing page); the SPA stays at /chat.
  location / {
    set $web_backend http://web-backend:8000;
    proxy_pass $web_backend;
    include /etc/nginx/proxy_common.conf;
  }

  location /chat {
    try_files $uri /chat/index.html;
  }

  location /accounts/ {
    include /etc/nginx/auth_snippet.conf;
    set $web_backend http://web-backend:8000;
    proxy_pass $web_backend;
    include /etc/nginx/proxy_common.conf;
  }

  location /admin/ {
    include /etc/nginx/auth_snippet.conf;
    set $web_backend http://web-backend:8000;
    proxy_pass $web_backend;
    include /etc/nginx/proxy_common.conf;
  }

  location /static/ {
    include /etc/nginx/auth_snippet.conf;
    set $web_backend http://web-backend:8000;
    proxy_pass $web_backend;
    include /etc/nginx/proxy_common.conf;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend_url http://agentic-backend:8000;
    proxy_pass $backend_url;
    include /etc/nginx/proxy_common.conf;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
