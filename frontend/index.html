<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoliticalAgent</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap");

      :root {
        color-scheme: light;
        --bg: #eef2f7;
        --bg-accent: #e0e8f0;
        --ink: #1f2937;
        --ink-muted: #475569;
        --card: #f8fafc;
        --accent: #1a8de8;
        --line: #d1dde8;
        --shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(26, 141, 232, 0.10), transparent 55%),
          radial-gradient(circle at bottom right, rgba(15, 40, 80, 0.08), transparent 45%),
          var(--bg);
        color: var(--ink);
      }

      #app {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .chat-shell {
        width: min(960px, 100%);
        background: var(--card);
        border-radius: 28px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      /* ── Header ── */
      .header-logo {
        height: 122px;
        width: auto;
        border-radius: 10px;
        flex-shrink: 0;
      }
      .chat-header-text {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .chat-header-title { flex: 1; min-width: 0; }
      .chat-header {
        padding: 24px 28px;
        background: linear-gradient(120deg, #111827 0%, #1f2937 55%, #0f172a 100%);
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .chat-header h1 { margin: 0; font-size: 22px; letter-spacing: 0.3px; }
      .chat-header p  { margin: 6px 0 0; font-size: 14px; opacity: 0.78; }

      /* ── Language picker ── */
      .lang-picker {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .lang-btn {
        font-size: 22px;
        line-height: 1;
        background: none;
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 4px 6px;
        cursor: pointer;
        opacity: 0.35;
        transition: opacity 0.15s, border-color 0.15s, background 0.15s;
      }
      .lang-btn:hover { opacity: 0.7; }
      .lang-btn.active {
        opacity: 1;
        border-color: rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.08);
      }

      /* ── Chat body ── */
      .chat-body {
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #f8fafc;
        max-height: 540px;
        min-height: 360px;
        overflow-y: auto;
        scroll-behavior: smooth;
      }

      /* ── Messages ── */
      .message-wrap { display: flex; flex-direction: column; gap: 3px; }
      .message-wrap.user  { align-items: flex-end; }
      .message-wrap.bot,
      .message-wrap.error { align-items: flex-start; }

      .message {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 15px;
        line-height: 1.55;
        word-break: break-word;
      }
      .message.user {
        background: linear-gradient(120deg, #42a5f5, #1a8de8);
        color: #fff;
        border-bottom-right-radius: 6px;
      }
      .message.bot {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
        border-bottom-left-radius: 6px;
      }
      .message.error {
        background: #fef2f2;
        color: #991b1b;
        border: 1px solid #fecaca;
        border-bottom-left-radius: 6px;
        font-size: 14px;
      }

      /* Markdown inside bot messages */
      .message.bot p               { margin: 0 0 8px; }
      .message.bot p:last-child    { margin-bottom: 0; }
      .message.bot h1, .message.bot h2, .message.bot h3 {
        margin: 14px 0 6px; font-size: 1em; font-weight: 600;
      }
      .message.bot ul, .message.bot ol { padding-left: 20px; margin: 6px 0; }
      .message.bot li               { margin-bottom: 3px; }
      .message.bot code             { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
      .message.bot pre              { background: #f1f5f9; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
      .message.bot pre code         { background: none; padding: 0; }
      .message.bot a                { color: var(--accent); }

      .message-time {
        font-size: 11px;
        color: var(--ink-muted);
        padding: 0 4px;
      }
      .streaming-draft {
        color: var(--ink-muted);
        font-size: 14px;
        font-style: italic;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .streaming-draft-caption {
        font-size: 11px;
        font-style: normal;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ── Example chips ── */
      .examples { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 8px; }
      .examples-hint {
        font-size: 11px;
        color: var(--ink-muted);
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-weight: 600;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 13px;
        color: var(--ink-muted);
        cursor: pointer;
        font-family: inherit;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
        line-height: 1.3;
        text-align: left;
      }
      .chip:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: rgba(26, 141, 232, 0.06);
      }

      /* ── Progress log (point 13) ── */
      .progress-log {
        background: #111827;
        color: #e2e8f0;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 13px;
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
        display: flex;
        flex-direction: column;
        gap: 5px;
        max-width: 75%;
        align-self: flex-start;
      }
      .progress-header {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 4px;
        font-family: inherit;
      }
      .progress-entry {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #64748b;
        transition: color 0.2s;
      }
      .progress-entry.active { color: #e2e8f0; }
      .progress-icon { flex-shrink: 0; width: 14px; }
      .progress-icon.done   { color: #34d399; }
      .progress-icon.active { color: var(--accent); }

      /* Spinner */
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner {
        display: inline-block;
        width: 13px;
        height: 13px;
        border: 2px solid rgba(26, 141, 232, 0.25);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
        flex-shrink: 0;
      }

      /* ── Footer ── */
      .chat-footer {
        display: flex;
        gap: 12px;
        padding: 16px 24px 24px;
        background: #fff;
        border-top: 1px solid var(--line);
      }
      .chat-footer input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font-size: 15px;
        font-family: inherit;
        color: var(--ink);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
        background: #fff;
      }
      .chat-footer input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(26, 141, 232, 0.16);
      }
      .chat-footer input:disabled { background: #f8fafc; color: var(--ink-muted); }

      .chat-footer button {
        border: none;
        background: var(--accent);
        color: #fff;
        padding: 12px 22px;
        border-radius: 12px;
        font-size: 15px;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: transform 0.15s, box-shadow 0.15s;
        box-shadow: 0 6px 18px rgba(26, 141, 232, 0.30);
      }
      .chat-footer button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 10px 26px rgba(26, 141, 232, 0.40);
      }
      .chat-footer button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* Loading dots on button */
      @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
      .btn-loading::after { content: '...'; display: inline-block; animation: blink 1.2s infinite; }

      @media (max-width: 640px) {
        .message      { max-width: 100%; }
        .progress-log { max-width: 100%; }
        .chat-footer  { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div id="app" x-data="chat">
      <div class="chat-shell">

        <header class="chat-header">
          <div class="chat-header-text">
            <img src="assets/logo.png" alt="PoliticalAgent" class="header-logo">
            <div class="chat-header-title">
              <h1>PoliticalAgent</h1>
              <p x-text="infosphere === 'polish'
                ? 'Wieloperspektywiczna analiza geopolityczna z weryfikacją faktów.'
                : 'Multi-perspective geopolitical analysis with fact verification.'">
              </p>
            </div>
          </div>
          <div class="lang-picker">
            <button
              class="lang-btn"
              :class="{ active: infosphere === 'polish' }"
              @click="infosphere = 'polish'"
              title="Polski"
              :disabled="isLoading"
            >🇵🇱</button>
            <button
              class="lang-btn"
              :class="{ active: infosphere === 'english' }"
              @click="infosphere = 'english'"
              title="English"
              :disabled="isLoading"
            >🇺🇸</button>
          </div>
        </header>

        <main class="chat-body" x-ref="chatBody">

          <template x-for="(msg, i) in messages" :key="i">
            <div class="message-wrap" :class="msg.role">
              <div class="message" :class="msg.role" x-html="renderContent(msg)"></div>
              <div class="message-time" x-text="formatTime(msg.timestamp)"></div>
            </div>
          </template>

          <!-- Example chips — only on fresh start -->
          <div class="examples" x-show="messages.length === 1 && !isLoading">
            <p class="examples-hint" x-text="t('examples_hint')"></p>
            <div class="chips">
              <template x-for="ex in t('examples')" :key="ex.q">
                <button class="chip" @click="fillExample(ex.q)" x-text="ex.label"></button>
              </template>
            </div>
          </div>

          <!-- Progress log — point 13 -->
          <div class="progress-log" x-show="progressLog.length > 0">
            <div class="progress-header">
              <span class="spinner"></span>
              <span x-text="t('analyzing_dots')"></span>
            </div>
            <template x-for="(entry, i) in progressLog" :key="i">
              <div class="progress-entry" :class="{ active: i === progressLog.length - 1 }">
                <span
                  class="progress-icon"
                  :class="i < progressLog.length - 1 ? 'done' : 'active'"
                  x-text="i < progressLog.length - 1 ? '✓' : '▶'"
                ></span>
                <span x-text="entry.label"></span>
              </div>
            </template>
          </div>
          <div class="streaming-draft" x-show="streamingDraft">
            <div class="streaming-draft-caption" x-text="t('drafting')"></div>
            <div x-text="streamingDraft"></div>
          </div>

        </main>

        <form class="chat-footer" @submit.prevent="sendMessage">
          <input
            x-ref="input"
            x-model.trim="input"
            type="text"
            :placeholder="t('placeholder')"
            :aria-label="t('placeholder')"
            :disabled="isLoading"
          />
          <button type="submit" :disabled="!input || isLoading">
            <span x-show="!isLoading" x-text="t('send')"></span>
            <span x-show="isLoading" class="btn-loading" x-text="t('analyzing')"></span>
          </button>
        </form>

      </div>
    </div>

    <script>
      marked.use({ breaks: true, gfm: true });

      const I18N = {
        polish: {
          welcome: "Cześć! Jestem **PoliticalAgent**. Specjalizuję się w wieloperspektywicznej analizie geopolitycznej — przeszukuję źródła lewicowe, centrowe i prawicowe, a następnie weryfikuję fakty.\n\nW czym mogę pomóc?",
          examples_hint: "Przykładowe pytania",
          examples: [
            { q: "Jakie są konsekwencje konfliktu na Ukrainie dla NATO?",  label: "Konsekwencje konfliktu na Ukrainie dla NATO" },
            { q: "Jak zmienia się rola Chin w światowej polityce?",         label: "Rola Chin w światowej polityce" },
            { q: "Co oznacza wzrost populizmu w Europie Zachodniej?",       label: "Wzrost populizmu w Europie Zachodniej" },
          ],
          placeholder:      "Napisz wiadomość... (Enter aby wysłać)",
          send:             "Wyślij",
          analyzing:        "Analizuję",
          analyzing_dots:   "Analizuję...",
          drafting:         "Szkic odpowiedzi...",
          timeout_error:    "⏱ Backend nie odpowiedział w ciągu 10 minut.",
          connection_error: (msg) => `Błąd połączenia: ${msg}`,
          server_error:     (code) => `Błąd serwera (${code}).`,
          time_locale:      "pl-PL",
        },
        english: {
          welcome: "Hello! I'm **PoliticalAgent**. I specialize in multi-perspective geopolitical analysis — I search left-leaning, centrist, and right-wing sources, then verify the facts.\n\nHow can I help you?",
          examples_hint: "Example questions",
          examples: [
            { q: "What are the consequences of the Ukraine conflict for NATO?", label: "Ukraine conflict consequences for NATO" },
            { q: "How is China's role in global politics changing?",            label: "China's role in global politics" },
            { q: "What does the rise of populism in Western Europe mean?",      label: "Rise of populism in Western Europe" },
          ],
          placeholder:      "Type a message... (Enter to send)",
          send:             "Send",
          analyzing:        "Analyzing",
          analyzing_dots:   "Analyzing...",
          drafting:         "Drafting answer...",
          timeout_error:    "⏱ Backend did not respond within 10 minutes.",
          connection_error: (msg) => `Connection error: ${msg}`,
          server_error:     (code) => `Server error (${code}).`,
          time_locale:      "en-US",
        },
      };

      document.addEventListener("alpine:init", () => {
        Alpine.data("chat", () => ({
          input: "",
          isLoading: false,
          infosphere: "polish",
          progressLog: [],
          streamingDraft: "",
          messages: [],

          init() {
            this.messages = [{ role: "bot", text: I18N.polish.welcome, timestamp: new Date() }];
            this.$watch("infosphere", (lang) => {
              // Update welcome message only if conversation hasn't started yet
              if (this.messages.length === 1 && this.messages[0].role === "bot") {
                this.messages[0].text = I18N[lang].welcome;
              }
            });
            this.$nextTick(() => this.$refs.input?.focus());
          },

          t(key) {
            return I18N[this.infosphere][key];
          },

          async sendMessage() {
            if (!this.input || this.isLoading) return;
            const text = this.input;
            this.input = "";
            this.messages.push({ role: "user", text, timestamp: new Date() });
            this.isLoading = true;
            this.progressLog = [];
            this.streamingDraft = "";
            this.scrollToBottom();

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 1000 * 60 * 10);

            try {
              const response = await fetch("/api/run_pipeline/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                signal: controller.signal,
                body: JSON.stringify({ query: text, infosphere: this.infosphere }),
              });

              if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.detail || this.t("server_error")(response.status));
              }

              const reader = response.body.getReader();
              const decoder = new TextDecoder();
              let buffer = "";

              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = lines.pop() ?? "";

                for (const line of lines) {
                  if (!line.startsWith("data: ")) continue;
                  try {
                    const data = JSON.parse(line.slice(6));
                    if (data.type === "progress") {
                      this.progressLog.push(data);
                      this.scrollToBottom();
                    } else if (data.type === "token") {
                      this.streamingDraft += data.content;
                      this.scrollToBottom();
                    } else if (data.type === "result") {
                      this.progressLog = [];
                      this.streamingDraft = "";
                      this.messages.push({ role: "bot", text: data.output, timestamp: new Date() });
                      this.scrollToBottom();
                    } else if (data.type === "error") {
                      this.progressLog = [];
                      this.streamingDraft = "";
                      this.messages.push({ role: "error", text: data.message, timestamp: new Date() });
                      this.scrollToBottom();
                    }
                  } catch {
                    // malformed SSE line — skip
                  }
                }
              }
            } catch (error) {
              this.progressLog = [];
              this.streamingDraft = "";
              const isTimeout = error?.name === "AbortError";
              this.messages.push({
                role: "error",
                text: isTimeout ? this.t("timeout_error") : this.t("connection_error")(error.message),
                timestamp: new Date(),
              });
              this.scrollToBottom();
            } finally {
              clearTimeout(timeoutId);
              this.isLoading = false;
              this.$nextTick(() => this.$refs.input?.focus());
            }
          },

          scrollToBottom() {
            this.$nextTick(() => {
              const el = this.$refs.chatBody;
              if (el) el.scrollTop = el.scrollHeight;
            });
          },

          formatTime(date) {
            return new Date(date).toLocaleTimeString(this.t("time_locale"), {
              hour: "2-digit",
              minute: "2-digit",
            });
          },

          fillExample(text) {
            this.input = text;
            this.$nextTick(() => this.$refs.input?.focus());
          },

          renderContent(msg) {
            if (msg.role === "bot") return marked.parse(msg.text ?? "");
            const el = document.createElement("div");
            el.textContent = msg.text;
            return el.innerHTML;
          },
        }));
      });
    </script>
  </body>
</html>
