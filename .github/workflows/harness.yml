name: Harness Integrity

on:
  pull_request:
    paths:
      - ".claude/**"
      - ".opencode/**"
      - ".github/skills/**"
      - ".github/prompts/**"
      - ".github/copilot-instructions.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "Makefile"
      - "scripts/ai_tools_inventory.py"
      - "scripts/log_metrics.py"
      - "docs/harness_logs/TEMPLATE.md"
      - "ai_tools_inventory.md"
      - "ai_tools_notes.md"

jobs:
  harness-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The make targets are the sync mechanisms themselves, so drift is
      # checked by re-running them and diffing: they are idempotent, and a
      # clean tree before this step means any diff they produce is drift.
      - name: Re-run the sync targets
        run: make sync-copilot link-skills inventory

      - name: Fail on drift
        if: ${{ !cancelled() }}
        run: |
          # `git diff` alone ignores untracked files, so a sync target that
          # creates a new file the PR never committed (e.g. a new skill added
          # to .claude/skills but not copied/linked) would pass silently.
          # `status --porcelain` catches those too.
          if [ -n "$(git status --porcelain -- \
            .github/skills .opencode/skills ai_tools_inventory.md)" ]; then
            git diff -- .github/skills .opencode/skills ai_tools_inventory.md
            echo
            echo "Harness drift detected: the sync targets changed files above."
            echo "Re-run from the repo root and commit the result:"
            echo
            echo "    make sync-copilot link-skills inventory"
            echo
            exit 1
          fi

      # CLAUDE.md is the single source of truth and the pointer files must not
      # start drifting: fail here rather than silently on the harnesses.
      - name: Guidance pointers still name CLAUDE.md
        run: |
          for f in AGENTS.md .github/copilot-instructions.md; do
            grep -q "CLAUDE.md" "$f" || {
              echo "$f no longer points at CLAUDE.md; the copy would drift" >&2
              exit 1
            }
          done

      # Command ports are existence-checked in CI; bodies remain verified by
      # hand (the port transform and harness notes are human judgement).
      - name: Claude commands have a port under every harness
        run: |
          missing=0
          for f in .claude/commands/*.md; do
            b=$(basename "$f" .md)
            for p in ".opencode/command/$b.md" ".github/prompts/$b.prompt.md"; do
              if [ ! -f "$p" ]; then
                echo "Missing port: $p (add it)" >&2
                missing=1
              fi
            done
          done
          exit $missing

      # The run logs moved to one folder; a command copied from an old branch
      # would quietly bring the retired names back.
      - name: No harness file names the retired log folders
        run: |
          if grep -rsInE "docs/(cc|opencode)_logs" \
            .claude/commands .claude/agents .claude/skills \
            .opencode/command .opencode/agents .opencode/agent \
            .github/prompts .github/agents .github/copilot-instructions.md AGENTS.md; then
            echo "Use docs/harness_logs/ (see docs/harness_logs/TEMPLATE.md)." >&2
            exit 1
          fi
