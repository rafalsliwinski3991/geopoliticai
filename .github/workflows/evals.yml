name: Evals

on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    environment: dev
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
      # The VPS Phoenix: https://politicalagent.eu/phoenix/v1/traces
      PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Install dependencies
        id: sync
        working-directory: agentic_backend
        run: uv sync --locked --dev

      - name: Run orchestrator evals
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: agentic_backend
        env:
          # nginx Basic Auth in front of the VPS Phoenix, in W3C header format
          # (every eval step below sends the same header):
          # Authorization=Basic%20<base64 of AUTH_USER:AUTH_PASSWORD>
          PHOENIX_CLIENT_HEADERS: ${{ secrets.PHOENIX_CLIENT_HEADERS }}
        run: uv run python -m evals.orchestrator

      - name: Run expert evals
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: agentic_backend
        env:
          PHOENIX_CLIENT_HEADERS: ${{ secrets.PHOENIX_CLIENT_HEADERS }}
        run: uv run python -m evals.expert

      - name: Run deep expert evals
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: agentic_backend
        env:
          PHOENIX_CLIENT_HEADERS: ${{ secrets.PHOENIX_CLIENT_HEADERS }}
        run: uv run python -m evals.deep_expert

      - name: Run reporter evals
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: agentic_backend
        env:
          PHOENIX_CLIENT_HEADERS: ${{ secrets.PHOENIX_CLIENT_HEADERS }}
        run: uv run python -m evals.reporter

      - name: Run e2e evals
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: agentic_backend
        env:
          PHOENIX_CLIENT_HEADERS: ${{ secrets.PHOENIX_CLIENT_HEADERS }}
        run: uv run python -m evals.e2e_orchestrator
      - name: Run the deep-forecaster e2e eval
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: agentic_backend
        env:
          PHOENIX_CLIENT_HEADERS: ${{ secrets.PHOENIX_CLIENT_HEADERS }}
        run: uv run python -m evals.e2e_deep_forecaster
