name: Evals

on:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    environment: dev
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ARIZE_PLATFORM: AX
      ARIZE_COLLECTOR_ENDPOINT: ${{ secrets.ARIZE_COLLECTOR_ENDPOINT }}
      ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
      PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
      ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        id: sync
        working-directory: app
        run: uv sync --locked --dev

      - name: Run orchestrator evals
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: app
        run: uv run python -m evals.orchestrator

      - name: Run expert evals
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: app
        run: uv run python -m evals.expert

      - name: Run reporter evals
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        working-directory: app
        run: uv run python -m evals.reporter

      - name: Run e2e evals
        if: ${{ !cancelled() }}
        working-directory: app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARIZE_PLATFORM: AX
          ARIZE_COLLECTOR_ENDPOINT: ${{ secrets.ARIZE_COLLECTOR_ENDPOINT }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: uv run python -m evals.e2e
