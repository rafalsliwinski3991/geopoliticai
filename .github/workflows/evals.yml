name: Evals

on:
  workflow_dispatch:
    inputs:
      type:
        description: "fixed: inputs written in advance; live: Brave and today's pages; all: both"
        type: choice
        options: [fixed, live, all]
        default: fixed
      evals:
        description: "Only these evals, comma-separated without spaces (e.g. expert_fixed,deep_expert_live); overrides type"
        type: string
        default: ""

jobs:
  # The eval names come from FIXED_EVALS and LIVE_EVALS in agentic_backend/Makefile
  # (a unit test keeps them equal to the datasets), so a new eval needs no edit here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      evals: ${{ steps.pick.outputs.evals }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: agentic_backend/Makefile
          sparse-checkout-cone-mode: false

      - name: Pick the evals to run
        id: pick
        env:
          EVAL_TYPE: ${{ inputs.type }}
          ONLY_EVALS: ${{ inputs.evals }}
        run: |
          fixed="$(sed -n 's/^FIXED_EVALS = //p' agentic_backend/Makefile)"
          live="$(sed -n 's/^LIVE_EVALS = //p' agentic_backend/Makefile)"
          case "$EVAL_TYPE" in
            fixed) names="$fixed" ;;
            live) names="$live" ;;
            *) names="$fixed $live" ;;
          esac
          if [ -n "$ONLY_EVALS" ]; then
            picked=""
            for name in $fixed $live; do
              case ",$ONLY_EVALS," in
                *",$name,"*) picked="$picked $name" ;;
              esac
            done
            names="$picked"
          fi
          if [ -z "${names// /}" ]; then
            echo "::error::No eval matches type '$EVAL_TYPE' and evals '$ONLY_EVALS'."
            exit 1
          fi
          quoted="$(printf '"%s",' $names)"
          echo "evals=[${quoted%,}]" >> "$GITHUB_OUTPUT"

  # One job per eval, all at once: the run takes as long as the slowest eval,
  # and one red eval does not cancel the others.
  evals:
    name: ${{ matrix.eval }}
    needs: plan
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        eval: ${{ fromJson(needs.plan.outputs.evals) }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
      # The VPS Phoenix: https://politicalagent.eu/phoenix/v1/traces
      PHOENIX_COLLECTOR_ENDPOINT: ${{ secrets.PHOENIX_COLLECTOR_ENDPOINT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: agentic_backend
        run: uv sync --locked --dev

      - name: Run ${{ matrix.eval }}
        working-directory: agentic_backend
        env:
          EVAL: ${{ matrix.eval }}
          # nginx Basic Auth in front of the VPS Phoenix, in W3C header format:
          # Authorization=Basic%20<base64 of AUTH_USER:AUTH_PASSWORD>
          PHOENIX_CLIENT_HEADERS: ${{ secrets.PHOENIX_CLIENT_HEADERS }}
        run: uv run python -m "evals.$EVAL"
