name: Unit Tests

on:
  pull_request:
  # deploy.yml calls this file so a deploy ships only a commit whose tests pass.
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          cache: true

      - name: Install dependencies
        working-directory: agentic_backend
        run: uv sync --locked --dev

      - name: Run unit tests
        working-directory: agentic_backend
        run: uv run pytest

  web-backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webbackend_test
          POSTGRES_USER: webbackend
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_DB: webbackend_test
      POSTGRES_USER: webbackend
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: django-ci-test-only-secret
      JWT_SIGNING_KEY: django-ci-test-only-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          cache: true

      - name: Install dependencies
        working-directory: web_backend
        run: uv sync --locked --dev

      - name: Collect static files
        working-directory: web_backend
        run: uv run python manage.py collectstatic --noinput

      - name: Run web-backend tests
        working-directory: web_backend
        run: uv run python manage.py test --exclude-tag=integration

  cross-service-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drift_test
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_DB: drift_test
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: django-ci-test-only-secret
      JWT_SIGNING_KEY: django-ci-test-only-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          cache: true

      - name: Migrate the Django-owned schema
        working-directory: web_backend
        run: |
          uv sync --locked --dev
          uv run python manage.py migrate

      # Alembic creates the `agentic` schema and relocates the checkpointer
      # tables BEFORE anything runs setup(); a fresh CI database has nothing to
      # move, so this is a schema create plus four no-ops.
      - name: Migrate the agentic-owned schema
        working-directory: agentic_backend
        run: |
          uv sync --locked --dev
          uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://drift:testpassword@127.0.0.1:5432/drift_test

      # The order is the point: Django's migrate runs before the drift suite,
      # whose fixture then runs the checkpointer's idempotent setup() itself.
      - name: Run the agentic web-schema suite
        working-directory: agentic_backend
        run: |
          uv sync --locked --dev
          uv run python -m pytest tests/integration_tests/
        env:
          DATABASE_URL: postgresql://drift:testpassword@127.0.0.1:5432/drift_test

      # The web suite's fixtures need the checkpointer tables, which the
      # agentic suite above just created; it must run after it.
      - name: Run the web-backend cross-schema suite
        working-directory: web_backend
        run: |
          uv sync --locked --dev
          uv run python manage.py test tests.integration_tests

  spa-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run SPA tests and the type-checking build
        working-directory: frontend/chat
        # Vitest transpiles without type-checking; `tsc -b && vite build` is
        # what catches type errors the test run would miss.
        run: npm ci && npm test && npm run build

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # shellcheck (preinstalled on the runner) guards the .sh files; uvx runs
      # the ruff that lints deploy/vps.py, floating like shellcheck:stable.
      - name: Lint and test the VPS scripts
        run: |
          shellcheck deploy/*.sh deploy/tests/*.sh
          uvx ruff check deploy/vps.py
          bash deploy/tests/test_vps.sh

