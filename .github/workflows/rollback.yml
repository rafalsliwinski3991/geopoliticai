name: Rollback

# Restores an earlier release AND the database snapshot taken right before the
# release that followed it. Everything written since that snapshot is lost,
# which is why the confirmation must be copied from that deploy's summary.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Release SHA to go back to (the "target=" value in a deploy summary)
        required: true
      confirm:
        description: The "confirm=" value from the deploy summary, e.g. delete-data-since-20260923T1402Z
        required: true

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    # Same environment (and secret placement) as the deploy job: main-only
    # deployment branches, enforced by GitHub, not the YAML.
    environment: production
    timeout-minutes: 30
    env:
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      TARGET: ${{ inputs.target }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # Inputs are validated here before they reach a remote shell.
      - name: Validate inputs
        run: |
          [[ $TARGET =~ ^[0-9a-f]{40}$ ]]
          [[ $CONFIRM =~ ^delete-data-since-[0-9]{8}T[0-9]{4}Z$ ]]

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The helper is shipped fresh instead of running the copy inside
      # current/: an older release's directory holds a vps.py that predates
      # the rollback command, and rolling back to it would fail before any
      # restore.
      - name: Ship a durable helper
        run: scp deploy/vps.py "$SSH_TARGET:/srv/geopoliticai/vps.py"

      - name: Restore and restart
        run: ssh "$SSH_TARGET" "python3 /srv/geopoliticai/vps.py rollback $TARGET $CONFIRM"

      - name: Public health check
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://politicalagent.eu/api/health
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null https://politicalagent.eu/
