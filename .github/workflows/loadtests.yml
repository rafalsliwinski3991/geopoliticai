name: Load tests

# The API against faked providers (agentic_backend/loadtests): no key, no
# database, no spend. Three loads run one after another on the same runner so
# their numbers compare, and the job summary puts them side by side.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agentic_backend/src/**"
      - "agentic_backend/loadtests/**"
      - "agentic_backend/uv.lock"
      - ".github/workflows/loadtests.yml"

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          cache: true

      - name: Install dependencies
        working-directory: agentic_backend
        run: uv sync --locked --dev

      # Locust, against the faked API (loadtests.run starts it), for a minute
      # each with users started over 5 s. Each load still runs after a failed
      # one, so the summary shows all three.
      - name: Load test, 50 users
        working-directory: agentic_backend
        run: >-
          mkdir -p results && uv run python -m loadtests.run --users 50 --spawn-rate 10
          --json-file results/users-50 --html results/users-50.html

      - name: Load test, 100 users
        if: ${{ !cancelled() }}
        working-directory: agentic_backend
        run: >-
          uv run python -m loadtests.run --users 100 --spawn-rate 20
          --json-file results/users-100 --html results/users-100.html

      - name: Load test, 150 users
        if: ${{ !cancelled() }}
        working-directory: agentic_backend
        run: >-
          uv run python -m loadtests.run --users 150 --spawn-rate 30
          --json-file results/users-150 --html results/users-150.html

      - name: Summarize
        if: ${{ !cancelled() }}
        working-directory: agentic_backend
        run: uv run python -m loadtests.compare results/users-*.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Locust reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: locust-reports
          path: agentic_backend/results/
