name: Load tests

# The API against faked providers (agentic_backend/loadtests): no key, no
# database, no spend. Three loads run one after another on the same runner so
# their numbers compare, and the job summary puts them side by side.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agentic_backend/src/**"
      - "agentic_backend/loadtests/**"
      - "agentic_backend/uv.lock"
      - ".github/workflows/loadtests.yml"

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          cache: true

      - name: Install dependencies
        working-directory: agentic_backend
        run: uv sync --locked --dev

      # Each load still runs after a failed one, so the summary shows all three.
      - name: Load test, 50 users
        working-directory: agentic_backend
        run: mkdir -p results && uv run python -m loadtests.run --users 50 --json-out results/users-50.json

      - name: Load test, 100 users
        if: ${{ !cancelled() }}
        working-directory: agentic_backend
        run: uv run python -m loadtests.run --users 100 --json-out results/users-100.json

      - name: Load test, 150 users
        if: ${{ !cancelled() }}
        working-directory: agentic_backend
        run: uv run python -m loadtests.run --users 150 --json-out results/users-150.json

      - name: Summarize
        if: ${{ !cancelled() }}
        working-directory: agentic_backend
        run: uv run python -m loadtests.compare results/*.json >> "$GITHUB_STEP_SUMMARY"
