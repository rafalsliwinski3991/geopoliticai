name: Harness Eval

# Advisory and manual: measures the current harness on the frozen
# deep-forecaster task and appends the scores to the `eval-history` branch.
# Gates nothing. Each implement leg runs `/rs-implement-plan` over the whole
# plan, with live API keys and a Postgres service so the plan's own gates run;
# the plan leg (plan-opus) is opt-in. Start it from the Actions tab, or
# comment `/harness_eval` (or `/harness_eval 3` for three repeats,
# `/harness_eval 1 impl-glm` for one leg) on a pull request from this
# repository. impl-sonnet and plan-opus spend the Claude Code subscription's
# usage limit, and every implement leg spends the HARNESS_EVAL_* keys.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Runs per agent (1 is usual; 2-5 to separate a change from noise)"
        type: number
        default: 1
      subjects:
        description: "Legs to run, comma-separated: impl-sonnet, impl-glm, plan-opus (opt-in; only impl-glm spends no Claude usage)"
        type: string
        default: "impl-sonnet,impl-glm"
      note:
        description: "What changed in the harness since the last run"
        type: string
        default: ""
  # GitHub runs issue_comment workflows from the default branch, so the
  # comment trigger works only once this file is on main.
  issue_comment:
    types: [created]

concurrency:
  # Every comment in the repository starts a run; only the ones that start an
  # eval may queue behind each other, so a plain comment cannot displace one.
  group: ${{ (github.event_name == 'workflow_dispatch' || (startsWith(github.event.comment.body, '/harness_eval') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) && 'harness-eval' || github.run_id }}
  cancel-in-progress: false

permissions: {}

env:
  CLAUDE_CODE_VERSION: "2.1.289"
  OPENCODE_VERSION: "1.18.34"
  TASK: scripts/harness_eval/fixtures/deep_forecaster

jobs:
  setup:
    # The comment path holds the API keys and a write token, so only people
    # with write access can start it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/harness_eval') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REPEATS: ${{ inputs.repeats }}
          INPUT_SUBJECTS: ${{ inputs.subjects }}
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$GITHUB_SHA
          n=$INPUT_REPEATS
          subjects=$INPUT_SUBJECTS
          if [ "$EVENT" = issue_comment ]; then
            # "/harness_eval", "/harness_eval 3", or "/harness_eval 1 impl-glm,impl-sonnet";
            # only the first line counts.
            read -r word arg subj _ <<< "$BODY"
            [ "$word" = /harness_eval ] || { echo "not a /harness_eval command: $word"; exit 1; }
            n=${arg:-1}
            subjects=${subj:-impl-sonnet,impl-glm}
            # The pull request's own head, never a fork's: this run holds secrets.
            read -r sha cross < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
              --json headRefOid,isCrossRepository -q '[.headRefOid, .isCrossRepository] | @tsv')
            [ "$cross" = false ] || { echo "pull requests from forks are not run"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          N=$n SUBJECTS=$subjects python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os

          # (kind, harness, model, agent-step minutes)
          LEGS = {
              "plan-opus": ("plan", "claude", "claude-opus-5-5", 120),
              "impl-sonnet": ("implement", "claude", "claude-sonnet-5-5", 300),
              "impl-glm": ("implement", "opencode", "opencode-go/glm-5.3-flash", 300),
          }
          # The job allows 60 minutes beyond the agent step: about 5 for setup,
          # up to 15 each for the baseline and the hard checks, then collect and
          # upload. GitHub ends any job at 360, so 300 is the longest agent step
          # that still uploads a timed-out run.
          SLACK = 60
          n = int(os.environ["N"])
          assert 1 <= n <= 5, n
          chosen = [x.strip() for x in os.environ["SUBJECTS"].split(",") if x.strip()]
          assert chosen and len(set(chosen)) == len(chosen), chosen
          assert all(x in LEGS for x in chosen), f"unknown leg in {chosen}; known: {list(LEGS)}"
          include = [
              {"subject": x, "kind": LEGS[x][0], "harness": LEGS[x][1], "model": LEGS[x][2],
               "step_minutes": LEGS[x][3], "job_minutes": LEGS[x][3] + SLACK, "repeat": r}
              for x in chosen
              for r in range(1, n + 1)
          ]
          print("matrix=" + json.dumps({"include": include}))
          PY

  agent:
    name: "${{ matrix.subject }} #${{ matrix.repeat }}"
    needs: setup
    runs-on: ubuntu-latest
    # Read access only for the checkout below; the token never reaches the
    # agent's environment, and the checkout is deleted before the agent runs.
    permissions:
      contents: read
    # The agent step's own limit comes from the matrix; this one leaves room
    # to collect and upload a timed-out run.
    timeout-minutes: ${{ matrix.job_minutes }}
    # The plan's integration, migration, and web-backend gates need the dev
    # Postgres; the root Makefile's targets reach it on 127.0.0.1:55432.
    services:
      postgres:
        # Docker Hub's anonymous CI pull budget is shared across GitHub's
        # runner IPs and exhausts without warning; the AWS public gallery
        # mirrors the official image with no rate limit.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: geopoliticai
          POSTGRES_USER: geopoliticai
          POSTGRES_PASSWORD: harness-eval-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the agent CLI
        env:
          HARNESS: ${{ matrix.harness }}
          OPENCODE_GO_API_KEY: ${{ matrix.harness == 'opencode' && secrets.OPENCODE_GO_API_KEY || '' }}
        run: |
          if [ "$HARNESS" = claude ]; then
            npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          else
            npm install -g "opencode-ai@$OPENCODE_VERSION"
            mkdir -p ~/.local/share/opencode
            jq -n --arg key "$OPENCODE_GO_API_KEY" '{"opencode-go": {type: "api", key: $key}}' \
              > ~/.local/share/opencode/auth.json
          fi

      - name: Build the agent's workspace
        id: ws
        env:
          KIND: ${{ matrix.kind }}
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          # Code and preambles only: the fixtures hold the answer key.
          mkdir -p "$tools/harness_eval"
          cp -a src/scripts/harness_eval/*.py "$tools/harness_eval/"
          cp -a src/scripts/harness_eval/preambles "$tools/"
          if [ "$KIND" = plan ]; then
            start=$(jq -r .plan.start "src/$TASK/task.json")
            fixture=brainstorm.md
            input=$(jq -r .plan.brainstorm "src/$TASK/task.json")
            output=$(jq -r .plan.output "src/$TASK/task.json")
            echo "name=rs-plan-from-brainstorm" >> "$GITHUB_OUTPUT"
            echo "args=$input $output" >> "$GITHUB_OUTPUT"
          else
            start=$(jq -r .implement.start "src/$TASK/task.json")
            fixture=plan.md
            input=$(jq -r .implement.plan "src/$TASK/task.json")
            output=""
            echo "name=rs-implement-plan" >> "$GITHUB_OUTPUT"
            echo "args=$input" >> "$GITHUB_OUTPUT"
          fi
          base=$(bash src/scripts/harness_eval/prepare.sh "$PWD/src" "$start" \
            "$TASK/$fixture" "$input" "$RUNNER_TEMP/ws")
          # The checkout holds the answer key (the merged units, the reference plan); the agent must not be able to read it.
          rm -rf src
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Write the app's .env
        if: matrix.kind == 'implement'
        working-directory: ${{ runner.temp }}/ws
        env:
          OPENAI_API_KEY: ${{ secrets.HARNESS_EVAL_OPENAI_API_KEY }}
          BRAVE_SEARCH_KEY: ${{ secrets.HARNESS_EVAL_BRAVE_SEARCH_KEY }}
          GEMINI_API_KEY: ${{ secrets.HARNESS_EVAL_GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.HARNESS_EVAL_OPENROUTER_API_KEY }}
        run: |
          # The plan's smoke gates read these through the app's own root .env,
          # which `.gitignore` keeps out of the candidate diff. Eval-only keys
          # with spending caps; "Collect the result" scrubs their values.
          # The root Makefile sources .env as shell, so values are single-quoted.
          for v in "$OPENAI_API_KEY" "$BRAVE_SEARCH_KEY" "$GEMINI_API_KEY" "$OPENROUTER_API_KEY"; do
            case "$v" in *"'"*) echo "a HARNESS_EVAL_* secret contains a single quote" >&2; exit 1;; esac
          done
          umask 077
          {
            printf "OPENAI_API_KEY='%s'\n" "$OPENAI_API_KEY"
            printf "BRAVE_SEARCH_KEY='%s'\n" "$BRAVE_SEARCH_KEY"
            printf "GEMINI_API_KEY='%s'\n" "$GEMINI_API_KEY"
            printf "OPENROUTER_API_KEY='%s'\n" "$OPENROUTER_API_KEY"
            echo "POSTGRES_PASSWORD=harness-eval-only"
            echo "DATABASE_URL=postgresql://geopoliticai:harness-eval-only@127.0.0.1:55432/geopoliticai"
            echo "JWT_SIGNING_KEY=harness-eval-only"
            echo "DJANGO_SECRET_KEY=harness-eval-only"
          } > .env

      - name: Install and baseline the tests
        id: before
        if: matrix.kind == 'implement'
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/ws/agentic_backend
        run: |
          uv sync --locked --dev
          if timeout -k 30 600 uv run make test >/dev/null 2>&1; then echo tests=0; else echo tests=1; fi >> "$GITHUB_OUTPUT"

      - name: Run the agent (Claude Code)
        id: claude
        if: matrix.harness == 'claude'
        timeout-minutes: ${{ matrix.step_minutes }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/ws
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ matrix.model }}
          KIND: ${{ matrix.kind }}
          PROMPT: /${{ steps.ws.outputs.name }} ${{ steps.ws.outputs.args }}
        run: |
          date +%s > "$RUNNER_TEMP/started"
          claude -p "$PROMPT" \
            --model "$MODEL" --effort medium \
            --permission-mode bypassPermissions \
            --disallowedTools AskUserQuestion \
            --append-system-prompt "$(cat "$RUNNER_TEMP/tools/preambles/$KIND.md")" \
            --mcp-config '{"mcpServers": {"context7": {"type": "http", "url": "https://mcp.context7.com/mcp"}}}' \
            --output-format json > "$RUNNER_TEMP/raw.json"

      - name: Run the agent (OpenCode)
        id: opencode
        if: matrix.harness == 'opencode'
        timeout-minutes: ${{ matrix.step_minutes }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/ws
        env:
          MODEL: ${{ matrix.model }}
          KIND: ${{ matrix.kind }}
          COMMAND: ${{ steps.ws.outputs.name }}
          ARGS: ${{ steps.ws.outputs.args }}
        run: |
          # OPENCODE_CONFIG_CONTENT outranks the project's opencode.jsonc: it
          # adds the preamble, denies the `question` tool (the repo's own
          # agents already use that key) so the run never waits, and turns
          # off the project's local chrome-devtools MCP server.
          export OPENCODE_CONFIG_CONTENT=$(jq -nc --arg p "$RUNNER_TEMP/tools/preambles/$KIND.md" \
            '{instructions: [$p], permission: {question: "deny"}, mcp: {"chrome-devtools": {enabled: false}}}')
          date +%s > "$RUNNER_TEMP/started"
          opencode run --auto --format json \
            --model "$MODEL" --command "$COMMAND" "$ARGS" > "$RUNNER_TEMP/raw.jsonl"

      - name: Stop the clock
        if: always()
        run: date +%s > "$RUNNER_TEMP/ended"

      - name: Run the hard checks
        id: after
        if: always() && steps.before.outcome == 'success'
        timeout-minutes: 15
        working-directory: ${{ runner.temp }}/ws
        env:
          BASE: ${{ steps.ws.outputs.base }}
        run: |
          git add -A -N
          mapfile -t py < <(git diff --name-only --diff-filter=d "$BASE" -- 'agentic_backend/*.py' \
            | sed 's#^agentic_backend/##')
          cd agentic_backend
          if timeout -k 30 600 uv run make test >/dev/null 2>&1; then echo tests=0; else echo tests=1; fi >> "$GITHUB_OUTPUT"
          # Lint judges only the agent's own files, with the app's ruff config.
          if [ ${#py[@]} -eq 0 ] || { uv run ruff check "${py[@]}" && uv run ruff format --diff "${py[@]}"; } >/dev/null 2>&1; then
            echo lint=0
          else
            echo lint=1
          fi >> "$GITHUB_OUTPUT"

      # A failed baseline setup is an infrastructure failure, not a bad run:
      # it leaves no artifact, so the judge records no row for the leg.
      - name: Collect the result
        if: always() && steps.ws.outcome == 'success' && steps.before.outcome != 'failure'
        working-directory: ${{ runner.temp }}/tools
        env:
          CHECKS: ${{ steps.before.outputs.tests }},${{ steps.after.outputs.tests }},${{ steps.after.outputs.lint }}
          OUTCOME: ${{ matrix.harness == 'claude' && steps.claude.outcome || steps.opencode.outcome }}
          STEP_MINUTES: ${{ matrix.step_minutes }}
          # The keys the agent saw in .env, scrubbed from every uploaded file.
          # Only those: this step runs code from $RUNNER_TEMP/tools, which the
          # agent could have edited, so it never receives a secret the agent
          # did not already hold. The plan leg gets none.
          OPENAI_API_KEY: ${{ matrix.kind == 'implement' && secrets.HARNESS_EVAL_OPENAI_API_KEY || '' }}
          BRAVE_SEARCH_KEY: ${{ matrix.kind == 'implement' && secrets.HARNESS_EVAL_BRAVE_SEARCH_KEY || '' }}
          GEMINI_API_KEY: ${{ matrix.kind == 'implement' && secrets.HARNESS_EVAL_GEMINI_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ matrix.kind == 'implement' && secrets.HARNESS_EVAL_OPENROUTER_API_KEY || '' }}
        run: |
          python3 -m harness_eval.collect \
            --subject "${{ matrix.subject }}" --kind "${{ matrix.kind }}" \
            --repeat "${{ matrix.repeat }}" --harness "${{ matrix.harness }}" \
            --model "${{ matrix.model }}" --raw "$RUNNER_TEMP/raw.json" \
            --ws "$RUNNER_TEMP/ws" --base "${{ steps.ws.outputs.base }}" \
            --output "${{ steps.ws.outputs.output }}" \
            --started-file "$RUNNER_TEMP/started" --ended-file "$RUNNER_TEMP/ended" \
            --step-timeout-s "$((STEP_MINUTES * 60))" --agent-outcome "$OUTCOME" \
            --checks "$CHECKS" \
            --redact-env OPENAI_API_KEY,BRAVE_SEARCH_KEY,GEMINI_API_KEY,OPENROUTER_API_KEY \
            --out "$RUNNER_TEMP/out"

      - name: Upload the result
        if: always() && steps.ws.outcome == 'success' && steps.before.outcome != 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.subject }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          overwrite: true

      # The agent steps use continue-on-error so the result above is saved and
      # judged even after a crash or a timeout, which also makes GitHub show
      # them as green. This last step turns the leg red and prints the reason.
      - name: Fail the leg if the agent did not finish
        if: always() && contains(fromJSON('["failure","cancelled"]'), matrix.harness == 'claude' && steps.claude.outcome || steps.opencode.outcome)
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          echo "The agent step failed or timed out. Its last output:"
          if [ "$HARNESS" = claude ]; then
            jq -r '.result // "(no result field)"' "$RUNNER_TEMP/raw.json" || echo "(no readable raw.json: the step was killed before it wrote one)"
          else
            tail -n 5 "$RUNNER_TEMP/raw.jsonl" || echo "(no raw.jsonl)"
          fi
          exit 1

  judge:
    needs: [setup, agent]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Download the agent results
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/results

      - name: Open the history branch
        run: |
          if git ls-remote --exit-code --heads origin eval-history >/dev/null; then
            git fetch -q origin eval-history
            git worktree add -q -B eval-history "$RUNNER_TEMP/history" FETCH_HEAD
          else
            git worktree add -q --orphan -b eval-history "$RUNNER_TEMP/history"
          fi

      - name: Judge the outputs
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTE: ${{ github.event_name == 'issue_comment' && format('PR {0}', github.event.issue.number) || inputs.note }}
          EVAL_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          uv run --no-project --python 3.12 \
            --with "google-genai>=1.33,<2" --with "pydantic>=2.9,<3" \
            python -m harness_eval.judge \
            --repo "$GITHUB_WORKSPACE" --fixtures "$GITHUB_WORKSPACE/$TASK" \
            --results "$RUNNER_TEMP/results" --history "$RUNNER_TEMP/history/history.jsonl" \
            --verdicts "$RUNNER_TEMP/verdicts.json" \
            --run-id "$GITHUB_RUN_ID" --sha "$EVAL_SHA" --note "$NOTE" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Save the history
        working-directory: ${{ runner.temp }}/history
        run: |
          git add history.jsonl
          # A re-run whose rows are all recorded stages nothing.
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Harness eval run $GITHUB_RUN_ID"
            git push -q origin eval-history
          fi

      - name: Upload the verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts
          path: ${{ runner.temp }}/verdicts.json
          if-no-files-found: ignore
          overwrite: true
