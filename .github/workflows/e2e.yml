name: E2E

# Advisory and dispatch-only (brainstorm 2026Oct13): run it by hand before a
# deploy. deploy.yml does not depend on it and nothing waits for it.
# It tests the dev configuration (docker-compose.override.yml: runserver,
# uvicorn --reload, nginx.local.conf, DEBUG on), built from this commit; it does
# not test the GHCR images, production nginx, or production cookie settings.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A fresh, throwaway .env: every password and signing key is random per
      # run. Values are generated into variables first so the add-mask lines
      # reach the runner log instead of a command substitution.
      - name: Write a throwaway .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
        run: |
          postgres_password="$(openssl rand -hex 24)"
          django_secret_key="$(openssl rand -hex 24)"
          jwt_signing_key="$(openssl rand -hex 24)"
          e2e_password="$(openssl rand -hex 24)"
          for value in "$postgres_password" "$django_secret_key" "$jwt_signing_key" "$e2e_password"; do
            echo "::add-mask::$value"
          done
          {
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "DJANGO_SECRET_KEY=$django_secret_key"
            echo "JWT_SIGNING_KEY=$jwt_signing_key"
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "BRAVE_SEARCH_KEY=$BRAVE_SEARCH_KEY"
            echo "E2E_EMAIL=e2e@example.com"
            echo "E2E_PASSWORD=$e2e_password"
          } > .env

      # Playwright's install does not need the stack, so it runs while the images build.
      - name: Build the stack and install Playwright
        run: |
          (cd e2e && npm ci && npx playwright install --with-deps chromium) &
          playwright=$!
          docker compose build
          wait "$playwright"

      # deploy/vps.py's order: agentic-backend refuses to start until Django
      # and then Alembic have migrated.
      - name: Migrate a fresh database
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm web-backend .venv/bin/python manage.py migrate --noinput
          docker compose run --rm web-backend .venv/bin/python manage.py createcachetable
          docker compose run --rm agentic-backend .venv/bin/alembic upgrade head

      - name: Start the stack
        run: |
          docker compose up -d --wait
          curl -fsS --retry 30 --retry-connrefused --retry-delay 2 -o /dev/null http://localhost:8082/accounts/login/
          curl -fsS --retry 30 --retry-connrefused --retry-delay 2 -o /dev/null http://localhost:8082/api/health

      - name: Create the test user
        run: docker compose exec -T web-backend .venv/bin/python manage.py create_e2e_user

      - name: Run the suite
        working-directory: e2e
        run: npx playwright test

      - name: Check the password reached no artifact
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: bash check-no-password.sh

      # Uploaded even when red: the evidence is the point. The password in it
      # is random and dies with this run's database.
      - name: Upload the report and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Print the app logs
        if: ${{ failure() }}
        run: docker compose logs --tail=100 agentic-backend web-backend
