[project]
name = "agent"
version = "0.0.1"
description = "GeopoliticAI LangGraph application."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1,<1.0",
    # 1.2.22 fixed prompt-loading path traversal (POLI-11).
    "langchain-core>=1.2.22,<2.0",
    "langchain-openai>=1.0,<2.0",
    # 1.2 is the first line compatible with langgraph-sdk>=0.4.4 (POLI-10);
    # it also raises the langchain-core floor to 1.4.7 through its own metadata.
    "langgraph>=1.2,<1.3",
    # 3.1.1 fixed the store namespace LIKE-prefix leak (POLI-26); its MIGRATIONS
    # are identical to 3.0.5's. Brings psycopg 3 and psycopg-pool, the only
    # Postgres driver in this app.
    "langgraph-checkpoint-postgres>=3.1.1,<4",
    "psycopg[binary]>=3.2,<4.0",
    "openai>=1.40,<2.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27,<1.0",
    "trafilatura>=2.0,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
    "arize-otel>=0.1,<1.0",
    "arize-phoenix-otel>=0.17,<1.0",
    "openinference-instrumentation-langchain>=0.1,<1.0",
    # 2.12.0 fixed the `crit` header vulnerability; this promotes what was a
    # dev-only transitive of langgraph-api to a runtime dependency.
    "pyjwt>=2.12,<3.0",
    # Alembic manages only the `agentic` schema this service owns; Django owns
    # `public`. A runtime dependency because production runs
    # `alembic upgrade head` inside this image (deploy/vps.py); development
    # still runs it from the host (`make migrate-agentic`).
    "alembic>=1.14,<2.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Transitive floors the lock must never drop below (Aikido findings).
constraint-dependencies = ["langsmith>=0.11.2"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "api",
    "auth",
    "config",
    "llm",
    "models",
    "search",
    "tracing",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*", "db*"]


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # Ruff split `Optional[X]` out of UP007 into UP045. LangGraph matches node
    # `config` annotations as strings and accepts only `RunnableConfig` or
    # `Optional[RunnableConfig]`, never `RunnableConfig | None`.
    "UP045",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"evals/*" = ["D", "T201", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
# `uv run pytest` does not put the cwd on sys.path; the eval tests import `evals.*`.
pythonpath = ["."]
# A bare `pytest` runs only the hermetic suite; the integration suite needs a
# real Postgres and is run by path (`make test-integration`).
testpaths = ["tests/unit_tests"]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
    # Manual live quality runner (`evals/`). These stay in `dev`:
    # Docker installs with `--no-dev` and copies only `src/`, while the runner
    # needs the Arize/Phoenix clients and evals only when invoked explicitly by
    # a reviewer.
    "arize>=8.52,<9.0",
    "arize-phoenix-client>=3.3,<4.0",
    "arize-phoenix-evals>=3.5.1,<4.0",
    "tenacity>=9.1,<10",
]
