# Alembic for the `agentic` schema only. The URL is not set here: `env.py`
# reads it from the root `.env` and rewrites the scheme, because SQLAlchemy
# resolves a bare `postgresql://` to psycopg2, which this project does not
# install.
[alembic]
# %(here)s, not a bare relative path: Alembic resolves a plain relative
# `script_location` against the CURRENT DIRECTORY, not against alembic.ini. The
# bare form only works because every call site happens to cd into
# `agentic_backend/` first.
script_location = %(here)s/src/db/agentic/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
